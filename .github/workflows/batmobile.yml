name: Generate Batman Contribution Grid

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: Omkareshwar-17

          outputs: |
            dist/github-contribution-grid.svg?palette=github-dark&color_snake=#F5C518&color_dots=#0d1117,#2b2b2b,#5c5019,#9b8418,#F5C518

      - name: Publish contribution grid
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
